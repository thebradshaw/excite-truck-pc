# Excite PC Network Play relay on Cloudflare Workers (free plan is enough).
# Deploy: npx wrangler deploy   (see README.md)
name = "excite-netplay"
main = "worker.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
